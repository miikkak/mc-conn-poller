---
name: Release

on: # yamllint disable-line rule:truthy
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (e.g., v1.2.3)"
        required: true
        type: string

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'workflow_dispatch' && inputs.tag || github.ref
    }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    uses: miikkak/workflows/.github/workflows/release-go.yml@4e98320b615507cfe54da82d8e932a08f45d8967 # main
    with:
      binary: mc-conn-poller
      extra-files: "README.md LICENSE etc/mc-conn-poller.yaml.example etc/init.d/mc-conn-poller etc/conf.d/mc-conn-poller"
      tag: ${{ inputs.tag || '' }}
